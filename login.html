<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Cardápio Escolar</title>


    <!-- Bootstrap 5 -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Fonte Poppins -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- CSS do site -->

    <link rel="stylesheet" href="CSS/site.css">

</head>


<body class="bg-light">


    <!-- ========================================
         CABEÇALHO
    ========================================= -->

    <header class="bg-white shadow-sm py-3">

        <div class="container">

            <div class="d-flex justify-content-between align-items-center">


                <!-- LOGO -->

                <a href="index.html" class="text-decoration-none">

                    <h2 class="m-0" style="color: #468C5C; font-weight: 700;">

                        Cardápio Escolar

                    </h2>

                </a>


                <!-- BOTÃO INÍCIO -->

                <a href="index.html" class="btn btn-outline-success">

                    <i class="bi bi-house"></i>

                    Início

                </a>

            </div>

        </div>

    </header>



    <!-- ========================================
         CONTEÚDO PRINCIPAL
    ========================================= -->

    <main>

        <section class="py-5">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-md-6 col-lg-5">


                        <!-- ========================================
                             CARD DE LOGIN
                        ========================================= -->

                        <div class="card border-0 shadow-sm rounded-4">

                            <div class="card-body p-4 p-md-5">


                                <!-- TÍTULO -->

                                <div class="text-center mb-4">

                                    <i class="bi bi-person-circle text-success" style="font-size: 3rem;">
                                    </i>


                                    <h1 class="h3 fw-bold mt-3">

                                        Entrar

                                    </h1>


                                    <p class="text-muted">

                                        Acesse sua conta

                                    </p>

                                </div>



                                <!-- ========================================
                                     FORMULÁRIO
                                ========================================= -->

                                <form id="loginForm" novalidate>


                                    <!-- E-MAIL -->

                                    <div class="mb-3">

                                        <label for="email" class="form-label fw-semibold">

                                            E-mail

                                        </label>


                                        <input type="email" class="form-control form-control-lg" id="email"
                                            placeholder="Digite seu e-mail" required>


                                        <div class="invalid-feedback">

                                            Digite um e-mail válido.

                                        </div>

                                    </div>



                                    <!-- SENHA -->

                                    <div class="mb-3">

                                        <label for="senha" class="form-label fw-semibold">

                                            Senha

                                        </label>


                                        <div class="input-group">

                                            <input type="password" class="form-control form-control-lg" id="senha"
                                                placeholder="Digite sua senha" required>


                                            <button type="button" class="btn btn-outline-secondary" id="mostrarSenha"
                                                title="Mostrar senha">

                                                <i class="bi bi-eye"></i>

                                            </button>

                                        </div>


                                        <div class="invalid-feedback">

                                            Digite sua senha.

                                        </div>

                                    </div>



                                    <!-- BOTÃO ENTRAR -->

                                    <div class="d-grid mt-4">

                                        <button type="submit" class="btn btn-success btn-lg">

                                            <i class="bi bi-box-arrow-in-right">
                                            </i>

                                            Entrar

                                        </button>

                                    </div>


                                </form>



                                <!-- ========================================
                                     DIVISOR
                                ========================================= -->

                                <div class="text-center my-4">

                                    <span class="text-muted">

                                        ou

                                    </span>

                                </div>



                                <!-- ========================================
                                     LOGIN GOOGLE
                                ========================================= -->

                                <div class="d-grid">

                                    <button type="button" class="btn btn-outline-dark btn-lg" id="loginGoogle">

                                        <i class="bi bi-google"></i>

                                        Entrar com Google

                                    </button>

                                </div>



                                <!-- ========================================
                                     CADASTRO
                                ========================================= -->

                                <p class="text-center text-muted mt-4 mb-0">

                                    Ainda não possui uma conta?

                                    <a href="cadastro.html" class="text-success fw-semibold">

                                        Cadastre-se

                                    </a>

                                </p>


                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- ========================================
         RODAPÉ
    ========================================= -->

    <footer class="bg-success text-white text-center py-4">

        <div class="container">

            <p class="mb-1">

                Escola Municipal Machado de Assis

            </p>


            <small>

                Prefeitura Municipal de Ituiutaba/MG

            </small>


            <p class="mt-2 mb-0">

                © 2026 - Todos os direitos reservados.

            </p>

        </div>

    </footer>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        /* ========================================
           FORMULÁRIO DE LOGIN
        ========================================= */

        const loginForm =
            document.querySelector("#loginForm");


        loginForm.addEventListener(
            "submit",
            async function (evento) {

                evento.preventDefault();


                /* ========================================
                   VALIDAÇÃO
                ========================================= */

                if (!loginForm.checkValidity()) {

                    loginForm.classList.add(
                        "was-validated"
                    );

                    return;

                }


                /* ========================================
                   PEGAR DADOS
                ========================================= */

                const email =
                    document.querySelector("#email").value.trim();


                const senha =
                    document.querySelector("#senha").value;



                try {


                    /* ========================================
                       ENVIAR PARA O BACKEND
                    ======================================== */

                    const resposta =
                        await fetch("/login", {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                email: email,

                                senha: senha

                            })

                        });



                    const resultado =
                        await resposta.json();



                    /* ========================================
                       VERIFICAR LOGIN
                    ======================================== */

                    if (!resposta.ok) {

                        alert(
                            resultado.mensagem ||
                            "E-mail ou senha incorretos."
                        );

                        return;

                    }



                    /* ========================================
                       DADOS DO USUÁRIO
                    ======================================== */

                    const usuario =
                        resultado.usuario;



                    /* ========================================
                       SALVAR LOGIN NO NAVEGADOR
                    ======================================== */

                    localStorage.setItem(
                        "usuarioLogado",
                        "true"
                    );


                    /*
                       ID DO USUÁRIO

                       Esse dado será utilizado posteriormente
                       para salvar os comentários no banco.
                    */

                    localStorage.setItem(
                        "usuarioId",
                        usuario.id_usuario
                    );


                    localStorage.setItem(
                        "usuarioEmail",
                        usuario.email
                    );


                    localStorage.setItem(
                        "usuarioNome",
                        usuario.nome
                    );



                    /* ========================================
                       CONSOLE
                    ======================================== */

                    console.log(
                        "Login realizado com sucesso."
                    );


                    console.log(
                        "ID do usuário:",
                        usuario.id_usuario
                    );


                    console.log(
                        "Nome do usuário:",
                        usuario.nome
                    );


                    console.log(
                        "E-mail do usuário:",
                        usuario.email
                    );



                    /* ========================================
                       MENSAGEM DE SUCESSO
                    ======================================== */

                    alert(
                        `Login realizado com sucesso! Bem-vindo, ${usuario.nome}.`
                    );



                    /* ========================================
                       REDIRECIONAR
                    ======================================== */

                    window.location.href =
                        "index.html";


                } catch (erro) {

                    console.error(
                        "Erro ao realizar login:",
                        erro
                    );


                    alert(
                        "Não foi possível realizar o login. Verifique se o servidor está funcionando."
                    );

                }

            }
        );



        /* ========================================
           MOSTRAR / OCULTAR SENHA
        ========================================= */

        const mostrarSenha =
            document.querySelector("#mostrarSenha");


        const campoSenha =
            document.querySelector("#senha");


        mostrarSenha.addEventListener(
            "click",
            function () {

                if (
                    campoSenha.type === "password"
                ) {

                    campoSenha.type = "text";


                    mostrarSenha.innerHTML =
                        '<i class="bi bi-eye-slash"></i>';

                    mostrarSenha.title =
                        "Ocultar senha";

                } else {

                    campoSenha.type =
                        "password";


                    mostrarSenha.innerHTML =
                        '<i class="bi bi-eye"></i>';

                    mostrarSenha.title =
                        "Mostrar senha";

                }

            }
        );



        /* ========================================
           LOGIN COM GOOGLE
        ========================================= */

        const loginGoogle =
            document.querySelector("#loginGoogle");


        loginGoogle.addEventListener(
            "click",
            function () {

                alert(
                    "O login com Google será implementado posteriormente."
                );

            }
        );

    </script>



    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
